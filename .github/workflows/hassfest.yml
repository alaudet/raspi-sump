name: Validate Home Assistant Integration

on:
  push:
    branches:
      - main
      - devel
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/hassfest.yml'
  pull_request:
    paths:
      - 'custom_components/**'
      - 'hacs.json'
      - '.github/workflows/hassfest.yml'
  schedule:
    # Home Assistant releases monthly; a weekly run catches deprecations
    # before a user's upgrade does.
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # raspi_sump is not in the home-assistant/brands repository, which
          # is expected for a custom integration distributed from its own repo.
          ignore: brands
