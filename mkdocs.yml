site_name: Raspi-Sump
site_url: https://raspisumpdocs.linuxnorth.org/
repo_url: https://github.com/alaudet/raspi-sump
repo_name: alaudet/raspi-sump
edit_uri: edit/main/docs/

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.action.edit
    - content.code.copy

markdown_extensions:
  - admonition
  - md_in_html
  - attr_list

nav:
  - Home: index.md
  - Table of Contents: contents.md
  - Installation:
    - Fresh Install: installation.md
    - Upgrading: upgrade.md
    - Full Uninstall: uninstall.md
  - Configuration: configuration.md
  - Web Interface: web-interface.md
  - Home Assistant: home-assistant.md
  - Alerts: alerts.md
  - CLI Tools: cli.md
  - Hardware: hardware.md
  - FAQ: faq.md
  - Security: security.md
  - Contributing: contributing.md
  - Version History: versions.md
